name: 'CI'
permissions:
  contents: read
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, test, lint]
    name: ${{ matrix.task }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just ${{ matrix.task }}
