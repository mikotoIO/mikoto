name: 'CI'
permissions:
  contents: read
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, test, lint]
    name: ${{ matrix.task }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # superego's integration tests (apps/superego/tests/api) need Postgres
      # and Redis on the docker-compose ports.
      - name: Start Postgres and Redis
        if: matrix.task == 'test'
        run: |
          docker run -d --name postgres -p 35101:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            --health-cmd pg_isready --health-interval 2s postgres:16
          docker run -d --name redis -p 35102:6379 redis:6.2-alpine
          until [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ]; do sleep 1; done
      - run: just ${{ matrix.task }}
